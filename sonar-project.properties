# Project Identification for SonarCloud
sonar.projectKey=your-sonarcloud-project-key  # Replace with your SonarCloud project key
sonar.organization=your-organization-key  # Replace with your SonarCloud organization key

# SonarCloud URL and Token
sonar.host.url=https://sonarcloud.io
sonar.login=your-sonarcloud-token  # Replace with your SonarCloud token (usually stored securely in CI/CD)

# Project Sources for Java and TypeScript
sonar.sources=apps/frontend/src,apps/backend/src
sonar.language=java,typescript

# Test and Coverage Configuration for TypeScript (frontend)
sonar.tests=apps/frontend/__tests__
sonar.test.inclusions=apps/frontend/src/**/*.test.tsx,apps/frontend/src/**/*.spec.tsx
sonar.typescript.lcov.reportPaths=coverage/apps/frontend/lcov.info

# Test and Coverage Configuration for Java (backend)
sonar.java.binaries=apps/backend/target/classes  # Update based on the location of Java class files
sonar.java.coveragePlugin=jacoco
sonar.jacoco.reportPaths=apps/backend/target/jacoco.exec

# Code Coverage Minimum Thresholds
sonar.coverage.exclusions=node_modules/**,dist/**
sonar.coverage.minimumCoverage=80

# Branch (optional - if using CI/CD)
sonar.branch.name=$(BRANCH_NAME)
