version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    image: xavierguertin/wildfirevisualization-backend:latest
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: http://backend:8080  # Used during build
    environment:
      - REACT_APP_BACKEND_URL=http://backend:8080    # Used during runtime
      - MAPTILER_API_KEY=${MAPTILER_API_KEY}
    image: xavierguertin/wildfirevisualization-frontend:latest
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend

  db:
    image: postgis/postgis:15-3.3  # Use PostGIS-enabled PostgreSQL image
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - ./apps/db_data:/var/lib/postgresql/data  # Persist database data
      - ./apps/db_init:/docker-entrypoint-initdb.d  # Initialization scripts

  geoserver:
    image: kartoza/geoserver:latest
    ports:
      - "8090:8080"
    environment:
      - GEOSERVER_ADMIN_USER=geoserver
      - GEOSERVER_ADMIN_PASSWORD=password
      - GEOSERVER_DATA_DIR=/var/geoserver/data_dir
      - RUN_AS_ROOT=TRUE
    volumes:
      - ./apps/geoserver_data:/var/geoserver/data_dir

networks:
  app-network:
    driver: bridge
