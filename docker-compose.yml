version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    image: xavierguertin/wildfirevisualization-backend:latest
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://backend:8080
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8080
      - MAPTILER_API_KEY=${MAPTILER_API_KEY}
    image: xavierguertin/wildfirevisualization-frontend:latest
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend

  db:
    build:
      context: ./apps/db
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - ./apps/db/data:/var/lib/postgresql/data

  geoserver:
    image: kartoza/geoserver:latest
    ports:
      - "8090:8080"
    environment:
      - GEOSERVER_ADMIN_USER=geoserver
      - GEOSERVER_ADMIN_PASSWORD=password
      - GEOSERVER_DATA_DIR=/var/geoserver/data_dir
      - RUN_AS_ROOT=TRUE
    volumes:
      - ./apps/geoserver_data:/var/geoserver/data_dir

networks:
  app-network:
    driver: bridge
