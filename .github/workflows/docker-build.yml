name: Docker Image CI

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Java Setup
      - name: Java Setup
        uses: actions/setup-java@v2
        with:
          java-version: '22'
          distribution: 'adopt'

      # Build Backend
      - name: Build Backend
        run: mvn clean package -f apps/backend

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # Build Services
      - name: Build
        run: docker-compose build frontend backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: password
          NEXT_PUBLIC_GEOSERVER_URL: http://localhost:8090/geoserver/Default/wms
          NEXT_PUBLIC_TILESERVER_URL: http://localhost:8081/data/OAM-World-1-8-min-J80
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
          CONFIG_FILE_PATH: /var/config/app-config.json
          GEOSERVER_DATA_DIR: /var/geoserver/data_dir/tiffs
          GEOSERVER_URL: http://geoserver:8080/geoserver

      # Push Docker images to Docker Hub
      - name: Push Docker Images
        run: docker-compose push

      # Tear down the services
      - name: Tear Down Services
        if: always()
        run: docker-compose down
