name: CI

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  frontend_ci:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Cache Cypress binary to avoid re-downloading
      - name: Cache Cypress
        uses: actions/cache@v3
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      # Install Node.js dependencies
      - run: npm install --legacy-peer-deps

      # Install Cypress binary explicitly to ensure it's available
      - name: Install Cypress Binary
        run: npx cypress install

      # Lint Frontend Projects
      - name: Lint Frontend Projects
        run: npx nx lint frontend

      # Build Frontend
      - name: Build Frontend
        run: npx nx build frontend

      # Test Frontend
      - name: Test Frontend
        run: npx nx test frontend

      # End-to-End Tests
      - name: End-to-End Tests
        run: npx nx e2e frontend-e2e

      # Set up Java 17 for SonarCloud compatibility
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # SonarCloud Analysis for Frontend
      - name: SonarCloud Scan Frontend
        run: |
          npx sonar-scanner -X \
            -Dproject.settings=sonar-project-frontend.properties \
            -Dsonar.projectKey="wildfirefrontendscanner_wildfirefrontendscanner" \
            -Dsonar.organization="wildfirefrontendscanner" \
            -Dsonar.login="9b48e7ee9628e35278f48d2951ea3e82db0be2f6" \
            -Dsonar.branch.name="${{ github.ref_name }}"

      - name: Check SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        with:
          sonar_token: '9b48e7ee9628e35278f48d2951ea3e82db0be2f6'

  backend_ci:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '22'

      # Install Node.js and dependencies
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Install Node.js dependencies (including Nx) for backend
      - name: Install Node.js Dependencies
        run: npm install --legacy-peer-deps

      # Lint Backend Projects
      - name: Lint Backend Projects
        run: npx nx lint backend

      # Build Backend
      - name: Build Backend
        run: npx nx build backend

      # Test Backend
      - name: Test Backend
        run: npx nx test backend

      # Verify Backend Coverage Files
      - name: List Backend Coverage Files
        run: ls -R apps/backend/target/site/jacoco/

      # SonarCloud Analysis for Backend
      - name: SonarCloud Scan Backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION_KEY: ${{ secrets.SONAR_ORGANIZATION_KEY }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          npx sonar-scanner -X \
            -Dproject.settings=sonar-project-backend.properties \
            -Dsonar.projectKey=$SONAR_PROJECT_KEY \
            -Dsonar.organization=$SONAR_ORGANIZATION_KEY \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.branch.name=$BRANCH_NAME

      - name: Check SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        with:
          sonar_token: ${{ secrets.SONAR_TOKEN }}
